[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudguard-iac"
description = "Shift-left security scanner for Terraform and container images, built for CI/CD."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Florian Martins" }]
keywords = [
  "devsecops",
  "security",
  "terraform",
  "docker",
  "iac",
  "sast",
  "cloud-security",
  "shift-left",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
  "typer>=0.12,<1.0",
  "rich>=13.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "bandit[toml]>=1.7",
  "pip-audit>=2.7",
  "build>=1.2",
  "twine>=5.1",
]

[project.urls]
Homepage = "https://github.com/FlorianMartins/cloudguard-iac"
Repository = "https://github.com/FlorianMartins/cloudguard-iac"
Issues = "https://github.com/FlorianMartins/cloudguard-iac/issues"
Changelog = "https://github.com/FlorianMartins/cloudguard-iac/blob/main/CHANGELOG.md"

[project.scripts]
cloudguard = "cloudguard.cli:run"

[tool.setuptools]
packages = ["cloudguard", "cloudguard.scanners", "cloudguard.reporters"]

[tool.setuptools.dynamic]
version = { attr = "cloudguard.__version__" }

# ---------------------------------------------------------------------------
# Lint & format — ruff replaces flake8, isort, pyupgrade and black
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "SIM",  # flake8-simplify
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "ARG",  # unused arguments
  "PTH",  # prefer pathlib
  "RET",  # return statements
  "D",    # pydocstyle
]
ignore = [
  "D203",   # incompatible with D211
  "D213",   # incompatible with D212
  "D107",   # __init__ documented at class level
  "B008",   # Typer declares options as defaults, by design
  "S101",   # assert is how pytest works
  "RET504", # named result variables aid readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D104", "S105", "S106", "ARG001"]
# The HTML reporter embeds its stylesheet: CSS rules read better on one line.
"cloudguard/reporters/html_reporter.py" = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
packages = ["cloudguard"]
strict = true
warn_unreachable = true
disallow_untyped_defs = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["cloudguard"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# ---------------------------------------------------------------------------
# SAST on our own code
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", "examples", ".venv", "build", "dist"]
