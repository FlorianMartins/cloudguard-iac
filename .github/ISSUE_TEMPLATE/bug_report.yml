name: "🐛 Bug"
description: Something else is broken — a crash, a wrong exit code, a malformed report.
title: "[BUG] …"
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The exact command, and the file it ran on.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CloudGuard version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and OS
      placeholder: "3.12 on Ubuntu 24.04"
    validations:
      required: true
